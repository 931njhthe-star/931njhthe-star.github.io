<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">CPU 작업 큐와 GPU CUDA stream 병렬 처리 개념도</title>
  <desc id="desc">이미지 작업이 CPU dispatcher에서 여러 예시 워커 큐로 나뉘고, CPU worker가 GPU의 비동기 CUDA stream에 연산을 제출한 뒤 결과를 취합하는 구조입니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#a5df61"/></marker>
    <linearGradient id="gpu" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#293d22"/><stop offset="1" stop-color="#1d2b1a"/></linearGradient>
  </defs>
  <rect width="1200" height="510" rx="18" fill="#101710"/>
  <text x="30" y="35" fill="#aee56c" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">EXECUTION MODEL · CONCEPTUAL EXAMPLE</text>
  <text x="30" y="59" fill="#dce8d5" font-family="Inter,Arial,sans-serif" font-size="13">CPU 작업 큐 분배와 GPU 비동기 실행 흐름</text>

  <rect x="28" y="216" width="128" height="112" rx="12" fill="#202c22" stroke="#526749"/>
  <text x="92" y="249" fill="#aee56c" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="800" text-anchor="middle">INPUT</text>
  <text x="92" y="276" fill="#f1f6ed" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="750" text-anchor="middle">이미지 작업</text>
  <text x="92" y="298" fill="#bdcbb6" font-family="Inter,Arial,sans-serif" font-size="10" text-anchor="middle">작업 단위 입력</text>

  <path d="M156 272H191" stroke="#a5df61" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="191" y="205" width="150" height="134" rx="12" fill="#202c22" stroke="#526749"/>
  <text x="266" y="236" fill="#aee56c" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="800" text-anchor="middle">CPU</text>
  <text x="266" y="264" fill="#f1f6ed" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="750" text-anchor="middle">작업 분배</text>
  <text x="266" y="286" fill="#bdcbb6" font-family="Inter,Arial,sans-serif" font-size="10" text-anchor="middle">멀티스레드 스케줄링</text>
  <text x="266" y="305" fill="#bdcbb6" font-family="Inter,Arial,sans-serif" font-size="10" text-anchor="middle">CPU–GPU 작업 할당</text>

  <path d="M342 272H366M366 153V391" fill="none" stroke="#83b84c" stroke-width="2"/>
  <path d="M366 153H401M366 272H401M366 391H401" stroke="#a5df61" stroke-width="2"/>

  <g font-family="Inter,Arial,sans-serif">
    <rect x="401" y="118" width="72" height="70" rx="9" fill="#26351f" stroke="#5c7948"/>
    <text x="437" y="145" fill="#aee56c" font-size="9" font-weight="800" text-anchor="middle">QUEUE A</text>
    <text x="437" y="166" fill="#dce8d5" font-size="9" text-anchor="middle">작업 대기</text>
    <rect x="488" y="118" width="118" height="70" rx="9" fill="#202c22" stroke="#526749"/>
    <text x="547" y="145" fill="#f1f6ed" font-size="11" font-weight="750" text-anchor="middle">CPU 코어 / 워커 A</text>
    <text x="547" y="166" fill="#bdcbb6" font-size="9" text-anchor="middle">전처리 · 제출</text>

    <rect x="401" y="237" width="72" height="70" rx="9" fill="#26351f" stroke="#5c7948"/>
    <text x="437" y="264" fill="#aee56c" font-size="9" font-weight="800" text-anchor="middle">QUEUE B</text>
    <text x="437" y="285" fill="#dce8d5" font-size="9" text-anchor="middle">작업 대기</text>
    <rect x="488" y="237" width="118" height="70" rx="9" fill="#202c22" stroke="#526749"/>
    <text x="547" y="264" fill="#f1f6ed" font-size="11" font-weight="750" text-anchor="middle">CPU 코어 / 워커 B</text>
    <text x="547" y="285" fill="#bdcbb6" font-size="9" text-anchor="middle">전처리 · 제출</text>

    <rect x="401" y="356" width="72" height="70" rx="9" fill="#26351f" stroke="#5c7948"/>
    <text x="437" y="398" fill="#aee56c" font-size="20" font-weight="800" text-anchor="middle">···</text>
    <rect x="488" y="356" width="118" height="70" rx="9" fill="#202c22" stroke="#526749"/>
    <text x="547" y="384" fill="#f1f6ed" font-size="11" font-weight="750" text-anchor="middle">CPU 코어 / 워커 …</text>
    <text x="547" y="405" fill="#bdcbb6" font-size="9" text-anchor="middle">다른 작업 분기</text>
  </g>

  <path d="M473 153H488M473 272H488M473 391H488" stroke="#a5df61" stroke-width="1.7"/>
  <rect x="650" y="75" width="350" height="378" rx="14" fill="url(#gpu)" stroke="#78a94b" stroke-width="1.4"/>
  <text x="670" y="98" fill="#b7e77c" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="800" letter-spacing=".7">SHARED GPU · CUDA ASYNC STREAMS</text>
  <text x="670" y="116" fill="#9caf92" font-family="Inter,Arial,sans-serif" font-size="9">CPU 워커가 비동기 연산을 제출</text>
  <path d="M606 153H670M606 272H670M606 391H670" fill="none" stroke="#a5df61" stroke-width="2"/>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="670" y="121" width="310" height="64" rx="8" fill="#142116" stroke="#49653b"/>
    <text x="684" y="143" fill="#b7e77c" font-size="9" font-weight="800">STREAM A</text>
    <rect x="765" y="132" width="54" height="42" rx="5" fill="#2a3c24" stroke="#638644"/><text x="792" y="158" fill="#e5f2dc" font-size="9" font-weight="700" text-anchor="middle">kernel</text>
    <path d="M822 153H836" stroke="#a5df61" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="842" y="132" width="54" height="42" rx="5" fill="#2a3c24" stroke="#638644"/><text x="869" y="158" fill="#e5f2dc" font-size="9" font-weight="700" text-anchor="middle">kernel</text>
    <text x="913" y="157" fill="#9caf92" font-size="9">…</text>

    <rect x="670" y="240" width="310" height="64" rx="8" fill="#142116" stroke="#49653b"/>
    <text x="684" y="262" fill="#b7e77c" font-size="9" font-weight="800">STREAM B</text>
    <rect x="765" y="251" width="54" height="42" rx="5" fill="#2a3c24" stroke="#638644"/><text x="792" y="277" fill="#e5f2dc" font-size="9" font-weight="700" text-anchor="middle">kernel</text>
    <path d="M822 272H836" stroke="#a5df61" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="842" y="251" width="54" height="42" rx="5" fill="#2a3c24" stroke="#638644"/><text x="869" y="277" fill="#e5f2dc" font-size="9" font-weight="700" text-anchor="middle">kernel</text>
    <text x="913" y="276" fill="#9caf92" font-size="9">…</text>

    <rect x="670" y="359" width="310" height="64" rx="8" fill="#142116" stroke="#49653b" stroke-dasharray="4 3"/>
    <text x="684" y="398" fill="#b7e77c" font-size="18" font-weight="800">···</text>
    <rect x="765" y="370" width="54" height="42" rx="5" fill="#2a3c24" stroke="#638644"/><text x="792" y="396" fill="#e5f2dc" font-size="9" font-weight="700" text-anchor="middle">kernel</text>
    <path d="M822 391H836" stroke="#a5df61" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="842" y="370" width="54" height="42" rx="5" fill="#2a3c24" stroke="#638644"/><text x="869" y="396" fill="#e5f2dc" font-size="9" font-weight="700" text-anchor="middle">kernel</text>
    <text x="913" y="395" fill="#9caf92" font-size="9">…</text>
  </g>

  <path d="M1000 272H1036" stroke="#a5df61" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1036" y="216" width="136" height="112" rx="12" fill="#202c22" stroke="#526749"/>
  <text x="1104" y="250" fill="#aee56c" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="800" text-anchor="middle">OUTPUT</text>
  <text x="1104" y="277" fill="#f1f6ed" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="750" text-anchor="middle">결과 취합</text>
  <text x="1104" y="300" fill="#bdcbb6" font-family="Inter,Arial,sans-serif" font-size="10" text-anchor="middle">검사 파이프라인으로</text>
</svg>
